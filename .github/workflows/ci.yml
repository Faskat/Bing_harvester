name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_release.py
      - run: npm ci
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem src,scripts -Recurse -Filter *.mjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid JavaScript: $($_.FullName)" }
          }
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: BingHarvester-win-x64
          path: dist/*.zip
          if-no-files-found: error
