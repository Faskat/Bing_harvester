# Сборка Bing Harvester.exe на GitHub.
# Тег v* (например v3.0.0) — сборка и релиз с zip; ручной запуск — только сборка (zip в артефактах).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: BingHarvester-win-x64
          path: dist/*.zip
          if-no-files-found: error

      # A published asset is immutable: rebuilding on a newer runner can change
      # the bundled Node executable. Reruns keep existing ZIPs and only fill gaps.
      # https://cli.github.com/manual/gh_release_upload
      - name: Publish release once
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(dist/*.zip)
          test -f "${assets[0]}"
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          if ! grep -Fxq -- "$GITHUB_REF_NAME" <<< "$releases"; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Bing Harvester $GITHUB_REF_NAME" --generate-notes
          fi
          existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"; do
            if grep -Fxq -- "$(basename "$asset")" <<< "$existing"; then
              echo "Already published: $(basename "$asset")"
            else
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          done
