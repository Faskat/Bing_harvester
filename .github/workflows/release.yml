# Сборка Bing Harvester.exe на GitHub.
# Тег v* (например v3.0.0) — сборка и релиз с zip; ручной запуск — только сборка (zip в артефактах).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: BingHarvester-win-x64
          path: dist/*.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Bing Harvester $GITHUB_REF_NAME" --generate-notes
